<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPS剩余价值计算器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap');
        body { background: #e2e8f0; font-family: 'DM Sans', 'PingFang SC', sans-serif; min-height: 100vh; margin: 0; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .cycle-btn { transition: all .15s; border: 1.5px solid #e2e8f0; background: white; color: #94a3b8; font-weight: 700; font-size: 12px; border-radius: 10px; padding: 8px 0; cursor: pointer; width: 100%; }
        .cycle-btn.active { background: #00BFA5; border-color: #00BFA5; color: white; box-shadow: 0 4px 14px rgba(0,191,165,.35); }
        .field-label { font-size: 10px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: #94a3b8; margin-bottom: 6px; }
        .field-input { width: 100%; padding: 11px 14px; background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px; font-size: 14px; font-weight: 600; color: #1e293b; outline: none; transition: all .15s; box-sizing: border-box; }
        .field-input:focus { border-color: #00BFA5; background: white; }
        .field-input.input-error { border-color: #ef4444 !important; background: #fef2f2 !important; }
        .result-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,.07); }
        .result-label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; }
        .result-value { font-size: 13px; font-weight: 800; color: #1e293b; }
        @keyframes toast-in { from { opacity:0; transform:translateX(-50%) translateY(12px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
        .toast-show { animation: toast-in .25s ease forwards; display: flex !important; }
        #remainingProgress { background: #00BFA5; height: 100%; transition: width 0.3s ease; }
        .rate-card { cursor: pointer; position: relative; }
        .rate-card.active { background-color: #ECFEFF !important; border-color: #00BFA5 !important; opacity:1 !important; }
        .rate-card.active::after { content: "✓"; position: absolute; top: 4px; right: 6px; font-size: 10px; color: #00BFA5; font-weight: bold; }
        .rate-card.offline { opacity: .55; }
        .rate-card.offline::before {
            content: "离线"; position: absolute; top: 4px; left: 6px;
            font-size: 8px; font-weight: 900; color: #b45309; background: #fef3c7; border-radius: 4px; padding: 0 3px;
        }
        #rateUpdateInfo { cursor: pointer; user-select: none; transition: color 0.2s; }
        #rateUpdateInfo:hover { filter: brightness(0.85); }

        @keyframes flashOnce {
            0%   { background: #fef9c3; border-color: #f59e0b; }
            100% { background: #f8fafc; border-color: #e2e8f0; }
        }
        .flash { animation: flashOnce .45s ease; }

        #overflowHint { display: none; }
        #overflowHint.show { display: block; }

        #sourceBadge {
            font-size: 9px; font-weight: 900; padding: 1px 6px; border-radius: 999px;
            margin-left: 4px; vertical-align: middle; white-space: nowrap;
        }
    </style>
</head>
<body class="p-4 md:p-8">

<div id="toast" class="fixed top-6 left-1/2 translate-x-[-50%] z-50 pointer-events-none hidden bg-gray-900 text-white text-xs font-bold px-5 py-2.5 rounded-full shadow-2xl items-center gap-2">
    <i class="fas fa-check-circle text-emerald-400"></i><span id="toastMsg"></span>
</div>

<div class="max-w-5xl mx-auto">
    <div class="grid grid-cols-12 gap-5">
        <div class="lg:col-span-7 space-y-4">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                <p class="field-label">① 续费信息</p>
                <div class="grid grid-cols-1 sm:grid-cols-5 gap-3 mb-4">
                    <div class="sm:col-span-3">
                        <div class="field-label">续费金额</div>
                        <input type="text" inputmode="decimal" id="renewalAmount" class="field-input" placeholder="请输入金额" autofocus>
                    </div>
                    <div class="sm:col-span-2">
                        <div class="field-label flex justify-between">
                            <span>当前币种</span>
                            <label id="customRateToggleBox" class="flex items-center gap-1 cursor-pointer normal-case">
                                <input type="checkbox" id="useCustomRate" class="accent-[#00BFA5]"> 自定义汇率
                            </label>
                        </div>
                        <div class="field-input text-center font-bold py-2.5 flex items-center justify-center" id="selectedCurrencyText">
                            USD · 美元
                        </div>
                        <div id="customRateWrapper" class="hidden mt-2 flex items-center gap-1.5 bg-gray-50 p-1.5 rounded-lg border">
                            <span class="text-[10px] font-bold text-gray-400 pl-1">1 <span id="customRateLabel">USD</span> =</span>
                            <input type="text" inputmode="decimal" id="customRateInput" class="field-input !py-1 !px-2 !text-[12px] !bg-white" placeholder="汇率">
                            <span class="text-[10px] font-bold text-gray-400 pr-1">CNY</span>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mt-4">
                    <div class="flex items-center justify-between mb-3">
                        <p class="text-xs font-black text-gray-400 uppercase tracking-widest">
                            <i class="fas fa-chart-area mr-1.5" style="color:#00BFA5"></i>实时汇率
                            <span id="sourceBadge"></span>
                        </p>
                        <span id="rateUpdateInfo" class="text-[10px] text-gray-500">加载中...</span>
                    </div>
                    <div class="grid grid-cols-5 gap-2" id="rateGrid"></div>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                <p class="field-label">② 时间信息</p>
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <div class="field-label">交易日期</div>
                        <input type="date" id="tradeDate" class="field-input">
                    </div>
                    <div>
                        <div class="field-label">到期日期</div>
                        <input type="date" id="expiryDate" class="field-input">
                    </div>
                </div>
                <div class="field-label">付款周期（按自然月/年真实天数计算）</div>
                <div class="grid grid-cols-6 gap-2" id="cycleSelector">
                    <button class="cycle-btn" data-cycle="1M">月付</button>
                    <button class="cycle-btn" data-cycle="3M">季付</button>
                    <button class="cycle-btn" data-cycle="6M">半年</button>
                    <button class="cycle-btn active" data-cycle="1Y">年付</button>
                    <button class="cycle-btn" data-cycle="2Y">两年</button>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                <p class="field-label">③ 交易结算</p>
                <div class="bg-emerald-50 border border-emerald-100 rounded-2xl p-4 mb-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <div class="text-[10px] font-black text-emerald-600 mb-1.5">实付卖家 (CNY)</div>
                            <input type="text" inputmode="decimal" id="actualPaid" class="field-input" placeholder="输入后自动算折溢价">
                        </div>
                        <div>
                            <div class="text-[10px] font-black text-emerald-600 mb-1.5">溢价/折价 (CNY)</div>
                            <input type="text" inputmode="decimal" id="premiumInput" class="field-input" placeholder="输入后自动算总价">
                        </div>
                    </div>
                    <div class="text-[9px] text-emerald-700 font-bold mt-2.5 flex items-center justify-between">
                        <span><i class="fas fa-lock mr-1"></i>正数=溢价，负数=折价，双向自动计算</span>
                        <span id="basisHint" class="text-emerald-500"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-5 lg:row-span-2">
            <div class="sticky top-6 bg-white rounded-2xl overflow-hidden shadow-xl border-b-4 border-[#00BFA5] p-7">
                <div class="text-center mb-6">
                    <p class="text-[#00BFA5] text-[10px] font-black tracking-widest mb-1">买家最终总支出 (CNY)</p>
                    <div id="resCNYBig" class="text-5xl font-black text-gray-800">¥ --</div>
                </div>

                <div id="premiumBox" class="hidden text-center mb-6 border-t border-gray-100 pt-4">
                    <p id="premiumTitle" class="text-[10px] font-black mb-1">卖家溢价</p>
                    <div id="premiumValueBig" class="text-2xl font-black text-red-500">--</div>
                </div>

                <div class="space-y-2 border-t border-gray-100 pt-4">
                    <div class="result-row"><span class="result-label">续费金额</span><span id="resOrig" class="result-value">--</span></div>
                    <div class="result-row"><span class="result-label">实付卖家</span><span id="resActual" class="result-value">¥ --</span></div>
                    <div class="result-row"><span class="result-label">官方日均</span><span id="dayOfficial" class="result-value">--</span></div>
                    <div class="result-row border-none"><span class="result-label text-[#00BFA5]">综合日均</span><span id="dayActual" class="result-value text-[#00BFA5]">--</span></div>
                </div>

                <div style="margin-top:24px">
                    <div style="display:flex; justify-content:space-between; align-items:center;font-size:10px;font-weight:800;text-transform:uppercase;margin-bottom:6px;">
                        <span style="color:#475569">剩余有效期</span>
                        <span id="remainingDays" style="color:#00BFA5;font-size:14px;font-weight:900;">-- 天</span>
                    </div>
                    <div style="background:rgba(0,0,0,.07);border-radius:99px;height:6px;overflow:hidden">
                        <div id="remainingProgress" style="width:0%"></div>
                    </div>
                    <div id="progressHint" style="text-align:right;font-size:10px;color:#475569;font-weight:700;margin-top:4px;"></div>
                    <div id="overflowHint" style="text-align:right;font-size:10px;color:#b45309;font-weight:700;margin-top:2px;">
                        <i class="fas fa-triangle-exclamation mr-1"></i>剩余超过一个计费周期，价值已超出单期续费
                    </div>
                </div>

                <div id="valueRatioBox" class="mt-5 pt-5 border-t border-gray-100 hidden">
                    <div class="flex justify-between text-[10px] font-black mb-1.5 uppercase text-gray-500"><span>价值构成比例</span></div>
                    <div class="h-3 bg-gray-100 rounded-full overflow-hidden flex">
                        <div id="barValue" class="h-full bg-[#00BFA5] transition-all duration-500" style="width:0%"></div>
                        <div id="barPremium" class="h-full bg-orange-400 transition-all duration-500" style="width:0%"></div>
                    </div>
                    <div class="flex gap-4 mt-2 text-[9px] font-bold" id="ratioTextWrapper">
                        <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-[#00BFA5]"></span>剩余价值 <span id="valuePercent" class="text-[#00BFA5]">0%</span></div>
                        <div class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-orange-400"></span>溢价部分 <span id="premiumPercent" class="text-orange-400">0%</span></div>
                    </div>
                </div>

                <div class="flex gap-2 mt-6">
                    <button id="copyBtn" class="flex-1 py-4 bg-[#00BFA5] rounded-xl font-black text-sm shadow-lg hover:scale-[1.02] transition-all text-white"><i class="fas fa-copy mr-2"></i>复制详情</button>
                    <button id="copyMdBtn" class="flex-1 py-4 bg-gray-700 rounded-xl font-black text-sm shadow-lg hover:scale-[1.02] transition-all text-white"><i class="fab fa-markdown mr-2"></i>复制 MD</button>
                    <button id="resetBtn" class="flex-1 py-4 bg-red-500/10 text-red-500 rounded-xl font-black text-sm hover:scale-[1.02] transition-all"><i class="fas fa-rotate-right mr-2"></i>重置</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';

    const $ = (id) => document.getElementById(id);
    const DOM = {
        renewalAmount: $('renewalAmount'), tradeDate: $('tradeDate'), expiryDate: $('expiryDate'),
        premiumInput: $('premiumInput'), actualPaid: $('actualPaid'),
        useCustomRate: $('useCustomRate'), customRateInput: $('customRateInput'),
        resCNYBig: $('resCNYBig'), resOrig: $('resOrig'), resActual: $('resActual'),
        remainingDays: $('remainingDays'), remainingProgress: $('remainingProgress'),
        progressHint: $('progressHint'), overflowHint: $('overflowHint'),
        dayOfficial: $('dayOfficial'), dayActual: $('dayActual'),
        rateUpdateInfo: $('rateUpdateInfo'), rateGrid: $('rateGrid'), sourceBadge: $('sourceBadge'),
        premiumBox: $('premiumBox'), premiumValueBig: $('premiumValueBig'), premiumTitle: $('premiumTitle'),
        valueRatioBox: $('valueRatioBox'), barValue: $('barValue'), barPremium: $('barPremium'),
        valuePercent: $('valuePercent'), premiumPercent: $('premiumPercent'),
        selectedCurrencyText: $('selectedCurrencyText'), customRateLabel: $('customRateLabel'),
        customRateWrapper: $('customRateWrapper'), customRateToggleBox: $('customRateToggleBox'),
        basisHint: $('basisHint'), toast: $('toast'), toastMsg: $('toastMsg')
    };

    // ===== 常量 =====
    const CURRENCIES = [
        ['USD', '美元'], ['EUR', '欧元'], ['GBP', '英镑'], ['HKD', '港币'], ['SGD', '新加坡元'],
        ['JPY', '日元'], ['AUD', '澳元'], ['CAD', '加元'], ['CHF', '瑞士法郎'], ['CNY', '人民币']
    ];
    const OFFLINE_RATES = { USD:6.88, EUR:7.38, GBP:8.12, HKD:0.88, SGD:5.18, JPY:0.046, AUD:4.55, CAD:5.02, CHF:7.61, CNY:1 };

    const SOURCE_META = {
        primary: { short: '主源', color: '#00BFA5', bg: '#ECFDF5', textColor: '#047857' },
        backup:  { short: '备用源', color: '#f59e0b', bg: '#FFFBEB', textColor: '#b45309' },
        offline: { short: '离线', color: '#ef4444', bg: '#FEF2F2', textColor: '#b91c1c' }
    };

    const CACHE_12H = 12 * 60 * 60 * 1000;
    const DAY_MS = 86400000;
    const DEFAULT_MONTHS = 6;   // 到期日期默认 = 今天 + 6 个自然月

    // ===== 状态 =====
    let cycleType = '1Y', timerToast = null, timerCalc = null, timerCount = null;
    let rates = {}, selectedCurrency = 'USD';
    let lastEdited = null, hasValidResult = false;
    let currentSourceKey = null, currentFromCache = false;

    const isOffline = () => currentSourceKey === 'offline';

    // ===== 小工具 =====
    const fmt = (n, d = 2) => isFinite(Number(n)) ? Number(n).toFixed(d) : (0).toFixed(d);
    const pad2 = (x) => String(x).padStart(2, '0');
    const flash = (el) => { if (!el) return; el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 500); };

    function parseLocalDate(str) {
        if (!str) return null;
        if (str instanceof Date) return str;
        const [y, m, d] = String(str).split('-').map(Number);
        return (isNaN(y) || isNaN(m) || isNaN(d)) ? null : new Date(y, m - 1, d);
    }
    const formatDateInput = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    function formatDateTime(ts) {
        const d = new Date(ts);
        return `${d.getFullYear()}/${pad2(d.getMonth()+1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
    }
    function addMonthsSafe(date, months) {
        const y = date.getFullYear(), m = date.getMonth(), d = date.getDate();
        const idx = m + months;
        const ty = y + Math.floor(idx / 12), tm = ((idx % 12) + 12) % 12;
        return new Date(ty, tm, Math.min(d, new Date(ty, tm + 1, 0).getDate()));
    }

    // ===== 汇率 =====
    const parseCnBase = (json) => {
        const r = json && json.rates;
        if (!r || typeof r.USD !== 'number') throw new Error('bad json');
        return Object.fromEntries(CURRENCIES.map(([c]) => [c, c === 'CNY' ? 1 : 1 / r[c]]));
    };
    const SRC = {
        primary: { url: 'https://v6.exchangerate-api.com/v6/416fc7318db286baaf635434/latest/CNY' },
        backup:  { url: 'https://open.er-api.com/v6/latest/CNY' }
    };
    async function fetchSource(key) {
        const res = await fetch(SRC[key].url);
        if (!res.ok) throw new Error(`${key} http ${res.status}`);
        return parseCnBase(await res.json());
    }
    const isValidRates = (o) => o && ['USD', 'EUR', 'GBP', 'CNY'].every(k => typeof o[k] === 'number' && isFinite(o[k]) && o[k] > 0);

    // ===== 缓存 =====
    function getRateCache() {
        try {
            const c = JSON.parse(localStorage.getItem('rateCache') || 'null');
            return c && isValidRates(c.rates) ? c : null;
        } catch { return null; }
    }
    function setRateCache(data, sourceKey) {
        try { localStorage.setItem('rateCache', JSON.stringify({ rates: data, updateTime: Date.now(), sourceKey: sourceKey || 'primary' })); } catch (e) {}
    }

    // ===== 来源展示 =====
    function renderSourceBadge() {
        const meta = SOURCE_META[currentSourceKey];
        if (!meta) { DOM.sourceBadge.textContent = ''; return; }
        DOM.sourceBadge.textContent = currentFromCache ? `${meta.short}·缓存` : meta.short;
        DOM.sourceBadge.style.background = meta.bg;
        DOM.sourceBadge.style.color = meta.textColor;
    }
    function updateRateInfoText() {
        const meta = SOURCE_META[currentSourceKey];
        const tag = meta ? `【${meta.short}${currentFromCache ? '·缓存' : ''}】` : '';

        if (isOffline()) {
            DOM.rateUpdateInfo.innerText = `${tag}当前为离线模式`;
            DOM.rateUpdateInfo.style.color = SOURCE_META.offline.color;
            return;
        }
        const cache = getRateCache();
        if (!cache) {
            DOM.rateUpdateInfo.innerText = `${tag}加载中...`;
            DOM.rateUpdateInfo.style.color = '#64748b';
            return;
        }
        const left = Math.max(0, cache.updateTime + CACHE_12H - Date.now());
        const sec = Math.floor(left / 1000), min = Math.floor(sec / 60), hour = Math.floor(min / 60);
        const leftText = hour > 0 ? `${hour}时${min % 60}分` : min > 0 ? `${min}分${sec % 60}秒` : `${sec}秒`;
        DOM.rateUpdateInfo.innerText = `${tag}刷新时间：${formatDateTime(cache.updateTime)}（剩余 ${leftText}）`;
        if (meta) DOM.rateUpdateInfo.style.color = meta.color;
    }

    function startCountDown() {
        clearInterval(timerCount);
        if (isOffline()) return;
        updateRateInfoText();
        timerCount = setInterval(() => {
            const cache = getRateCache();
            if (cache && Date.now() >= cache.updateTime + CACHE_12H) {
                clearInterval(timerCount);
                showToast('汇率缓存已过期，正在自动刷新');
                fetchRealRates();
                return;
            }
            updateRateInfoText();
        }, 1000);
    }

    async function refreshNow() {
        if (isOffline()) { showToast('离线模式无法刷新汇率'); return; }
        localStorage.removeItem('rateCache');
        DOM.rateUpdateInfo.innerText = '刷新中...';
        await fetchRealRates();
        showToast('汇率已强制刷新');
    }

    async function fetchRealRates() {
        const cache = getRateCache();
        if (cache && Date.now() - cache.updateTime < CACHE_12H) {
            rates = cache.rates;
            currentSourceKey = cache.sourceKey || 'primary';
            currentFromCache = true;
            startCountDown(); renderRateGrid(); renderSourceBadge(); calculate();
            return;
        }

        currentFromCache = false;
        for (const key of ['primary', 'backup']) {
            try {
                const cand = await fetchSource(key);
                if (isValidRates(cand)) {
                    rates = cand;
                    currentSourceKey = key;
                    setRateCache(rates, key);
                    startCountDown();
                    renderRateGrid(); renderSourceBadge(); calculate();
                    return;
                }
            } catch (e) { /* 下一个源 */ }
        }

        rates = { ...OFFLINE_RATES };
        currentSourceKey = 'offline';
        updateRateInfoText();
        renderRateGrid(); renderSourceBadge(); calculate();
    }

    function renderRateGrid() {
        DOM.rateGrid.innerHTML = '';
        const frag = document.createDocumentFragment();
        CURRENCIES.forEach(([code, name]) => {
            const rt = rates[code];
            if (!rt) return;
            const card = document.createElement('div');
            card.className = 'rate-card text-center p-2 rounded-xl border border-slate-100 bg-slate-50 '
                + (code === selectedCurrency ? 'active ' : '') + (isOffline() ? 'offline' : '');
            card.dataset.code = code;
            card.innerHTML = `<div class="text-[9px] font-bold text-slate-400">${code} · ${name}</div>
                              <div class="text-[11px] font-extrabold text-slate-700 mt-1">${rt.toFixed(3)}</div>`;
            card.addEventListener('click', () => selectCurrency(code, card));
            frag.appendChild(card);
        });
        DOM.rateGrid.appendChild(frag);
    }
    function selectCurrency(code, card) {
        selectedCurrency = code;
        DOM.rateGrid.querySelectorAll('.rate-card').forEach(x => x.classList.remove('active'));
        card.classList.add('active');
        const name = CURRENCIES.find(c => c[0] === code)?.[1] || '';
        DOM.selectedCurrencyText.innerText = `${code} · ${name}`;
        DOM.customRateLabel.innerText = code;
        lastEdited = null;
        calculate();
    }

    function getRealCycleDays(startStr, cycle) {
        const s = parseLocalDate(startStr);
        if (!s) return 0;
        const months = { '1M':1, '3M':3, '6M':6, '1Y':12, '2Y':24 }[cycle] || 12;
        return (addMonthsSafe(s, months) - s) / DAY_MS;
    }

    function updateBasisHint() {
        DOM.basisHint.innerText =
            lastEdited === 'premiumInput' ? '当前以「溢价」为基准' :
            lastEdited === 'actualPaid'   ? '当前以「实付」为基准' : '';
    }

    // ===== 核心计算 =====
    function calculate(sourceInput = null) {
        const curr = selectedCurrency;
        DOM.customRateLabel.innerText = curr;
        DOM.customRateToggleBox.style.display = curr === 'CNY' ? 'none' : 'flex';
        DOM.customRateWrapper.classList.toggle('hidden', !DOM.useCustomRate.checked);

        if (sourceInput === 'actualPaid' || sourceInput === 'premiumInput') lastEdited = sourceInput;
        else if (sourceInput !== null) lastEdited = 'actualPaid';
        updateBasisHint();

        DOM.customRateInput.classList.remove('input-error');
        let customInvalid = false;
        if (DOM.useCustomRate.checked && curr !== 'CNY') {
            const cv = parseFloat(DOM.customRateInput.value.trim());
            if (!DOM.customRateInput.value.trim() || isNaN(cv) || cv <= 0) {
                customInvalid = true;
                DOM.customRateInput.classList.add('input-error');
            }
        }

        const amt = parseFloat(DOM.renewalAmount.value) || 0;
        const tStr = DOM.tradeDate.value, exStr = DOM.expiryDate.value;
        if (!amt || !tStr || !exStr) return resetResults();

        const td = parseLocalDate(tStr), ed = parseLocalDate(exStr);
        if (!td || !ed) return resetResults();

        const rem = (ed - td) / DAY_MS;
        if (rem <= 0) return resetResults();

        const totalDays = getRealCycleDays(tStr, cycleType);
        if (totalDays <= 0) return resetResults();

        let rt = rates[curr] || 1;
        if (DOM.useCustomRate.checked) {
            if (customInvalid) return resetResults();
            rt = parseFloat(DOM.customRateInput.value);
        }

        const ratio = rem / totalDays;
        const cny = amt * ratio * rt;
        const origCNY = amt * rt;

        const hasActual = DOM.actualPaid.value.trim() !== '';
        const hasPrem = DOM.premiumInput.value.trim() !== '';
        const basis = (lastEdited === 'premiumInput' && hasPrem) ? 'premium'
                    : (hasActual ? 'actual'
                    : (hasPrem ? 'premium' : 'none'));

        let prem = 0, actual = cny;
        if (basis === 'premium') {
            prem = parseFloat(DOM.premiumInput.value) || 0;
            actual = cny + prem;
            DOM.actualPaid.value = fmt(actual);
            if (lastEdited === 'premiumInput') flash(DOM.actualPaid);
        } else if (basis === 'actual') {
            actual = parseFloat(DOM.actualPaid.value) || cny;
            prem = actual - cny;
            DOM.premiumInput.value = fmt(prem);
            if (lastEdited === 'actualPaid') flash(DOM.premiumInput);
        }

        hasValidResult = true;
        const dayOfficial = origCNY / totalDays;
        const dayActual = actual / rem;

        DOM.resCNYBig.innerText = `¥ ${fmt(actual)}`;
        DOM.resOrig.innerText = curr === 'CNY' ? `${fmt(amt)} CNY` : `${fmt(amt)} ${curr}(≈${fmt(origCNY)}元)`;
        DOM.remainingDays.innerText = `${fmt(rem, 1)} 天`;
        DOM.remainingProgress.style.width = (Math.min(ratio, 1) * 100) + '%';
        DOM.progressHint.innerText = `总周期 ${Math.round(totalDays)} 天`;
        DOM.overflowHint.classList.toggle('show', ratio > 1.0001);
        DOM.resActual.innerText = `¥ ${fmt(actual)}`;
        DOM.dayOfficial.innerText = `¥${fmt(dayOfficial)}`;
        DOM.dayActual.innerText = `¥${fmt(dayActual)}`;

        if (Math.abs(prem) < 0.005) {
            DOM.premiumBox.classList.add('hidden');
            DOM.valueRatioBox.classList.add('hidden');
        } else {
            DOM.premiumBox.classList.remove('hidden');
            DOM.premiumTitle.innerText = prem >= 0 ? '卖家溢价' : '卖家折价';
            DOM.premiumValueBig.innerText = (prem >= 0 ? '+' : '') + `¥ ${fmt(prem)}`;
            DOM.premiumValueBig.className = prem >= 0
                ? 'text-2xl font-black text-red-500' : 'text-2xl font-black text-green-500';
            DOM.valueRatioBox.classList.remove('hidden');
            const total = cny + Math.max(0, prem) || 1;
            const vp = (cny / total) * 100, pp = (Math.max(0, prem) / total) * 100;
            DOM.barValue.style.width = vp + '%';
            DOM.barPremium.style.width = pp + '%';
            DOM.valuePercent.innerText = fmt(vp, 1) + '%';
            DOM.premiumPercent.innerText = fmt(pp, 1) + '%';
        }
    }

    function resetResults() {
        hasValidResult = false;
        DOM.resCNYBig.innerText = '¥ --';
        DOM.resOrig.innerText = '--';
        DOM.remainingDays.innerText = '-- 天';
        DOM.remainingProgress.style.width = '0%';
        DOM.progressHint.innerText = '';
        DOM.overflowHint.classList.remove('show');
        DOM.resActual.innerText = '¥ --';
        DOM.dayOfficial.innerText = '--';
        DOM.dayActual.innerText = '--';
        DOM.premiumBox.classList.add('hidden');
        DOM.valueRatioBox.classList.add('hidden');
    }

    function showToast(m) {
        clearTimeout(timerToast);
        DOM.toastMsg.innerText = m;
        DOM.toast.classList.remove('hidden'); DOM.toast.classList.add('toast-show');
        timerToast = setTimeout(() => { DOM.toast.classList.remove('toast-show'); DOM.toast.classList.add('hidden'); }, 2000);
    }

    const CYCLE_NAME = { '1M':'月付', '3M':'季付', '6M':'半年', '1Y':'年付', '2Y':'两年' };
    function buildCopyText(markdown) {
        const amt = DOM.resOrig.innerText, cycle = CYCLE_NAME[cycleType] || '-';
        const exp = DOM.expiryDate.value, val = DOM.resCNYBig.innerText;
        const prem = parseFloat(DOM.premiumInput.value) || 0, pay = DOM.resActual.innerText;
        const premLine = Math.abs(prem) > 0.01 ? `${prem >= 0 ? '溢价' : '折价'}：¥${fmt(prem)}` : '';
        if (markdown) {
            let md = `### VPS剩余价值计算\n- 续费金额：${amt}\n- 付款周期：${cycle}\n- 到期日期：${exp}\n- 剩余价值：${val}\n`;
            if (premLine) md += `- ${premLine}\n`;
            return md + `- 实付金额：${pay}`;
        }
        let txt = `【VPS剩余价值计算】\n续费金额：${amt}\n付款周期：${cycle}\n到期日期：${exp}\n剩余价值：${val}\n`;
        if (premLine) txt += premLine + '\n';
        return txt + `实付金额：${pay}`;
    }
    async function doCopy(markdown) {
        if (!hasValidResult) { showToast('请先填写完整信息'); return; }
        const text = buildCopyText(markdown);
        try {
            await navigator.clipboard.writeText(text);
            showToast(markdown ? '已复制Markdown' : '已复制详情');
        } catch {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            const ok = document.execCommand('copy');
            ta.remove();
            showToast(ok ? (markdown ? '已复制Markdown' : '已复制详情') : '复制失败，请手动选择');
        }
    }

    // ===== 事件 =====
    function debounce(id) {
        clearTimeout(timerCalc);
        timerCalc = setTimeout(() => calculate(id), 60);
    }

    // 【改动】默认日期：今天 / 今天 + 6 个自然月
    function applyDefaultDates() {
        const today = new Date();
        DOM.tradeDate.value = formatDateInput(today);
        DOM.expiryDate.value = formatDateInput(addMonthsSafe(today, DEFAULT_MONTHS));
    }

    function doReset() {
        ['renewalAmount', 'actualPaid', 'premiumInput', 'customRateInput'].forEach(id => $(id).value = '');
        DOM.customRateInput.classList.remove('input-error');
        DOM.useCustomRate.checked = false;
        lastEdited = null;
        applyDefaultDates();
        calculate();
        DOM.renewalAmount.focus();
        showToast('已重置');
    }

    function initEvents() {
        document.querySelectorAll('.cycle-btn').forEach(btn =>
            btn.addEventListener('click', () => {
                document.querySelectorAll('.cycle-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                cycleType = btn.dataset.cycle;
                calculate();
            })
        );

        DOM.useCustomRate.addEventListener('change', () => calculate());
        DOM.actualPaid.addEventListener('input', () => debounce('actualPaid'));
        DOM.premiumInput.addEventListener('input', () => debounce('premiumInput'));
        ['renewalAmount', 'tradeDate', 'expiryDate', 'customRateInput'].forEach(id =>
            $(id).addEventListener('input', () => debounce(id))
        );

        $('copyBtn').addEventListener('click', () => doCopy(false));
        $('copyMdBtn').addEventListener('click', () => doCopy(true));
        $('resetBtn').addEventListener('click', doReset);
        DOM.rateUpdateInfo.addEventListener('click', refreshNow);
    }

    window.addEventListener('DOMContentLoaded', () => {
        applyDefaultDates();
        initEvents();
        fetchRealRates();
        calculate();
        DOM.renewalAmount.focus();
    });
})();
</script>
</body>
</html>
